<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transmon Design Estimator</title>
  <meta name="description" content="Step-by-step estimator for a flux-tunable transmon pair with dispersive readout and a tunable coupler.">
  <link rel="icon" type="image/x-icon" href="./icon.ico">
  <script>
    // Resolve the theme before first paint
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('tde-state-v2') || '{}').theme; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if (t === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
